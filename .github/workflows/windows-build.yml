name: Windows Packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Check frontend build
        run: npm run build

      - name: Check synchronized app versions
        run: npm run check:version

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build-windows:
    name: Build Windows x64 packages
    needs: quality
    if: github.event_name != 'pull_request' && needs.quality.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build application and installers
        run: npm run tauri build

      - name: Package DailyFlow CLI Skill
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path skills/dailyflow-cli -DestinationPath release-assets/dailyflow-cli-skill.zip -Force

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = node scripts/check-version.cjs --print
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: DailyFlow-Windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/release/dailyflow.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            release-assets/dailyflow-cli-skill.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: dailyflow-v${{ steps.version.outputs.version }}-${{ github.run_number }}-${{ github.run_attempt }}
          name: DailyFlow v${{ steps.version.outputs.version }} build ${{ github.run_number }}.${{ github.run_attempt }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/dailyflow.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            release-assets/dailyflow-cli-skill.zip
